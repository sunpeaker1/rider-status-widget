plugins {
    id "com.android.application"
}

android {
    namespace "com.sym.riderstatuswidget"
    compileSdk 35

    defaultConfig {
        applicationId "com.sym.riderstatuswidget"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "0.2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
